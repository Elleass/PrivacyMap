server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    root /app/;
    index index.php;

    location ~ ^/(?:src|docker|docs|\.git|\.vs)(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* \.(?:sql|md|ya?ml|ini|log|env)$ {
        return 404;
    }

    location = /config.php {
        return 404;
    }

    location = /Database.php {
        return 404;
    }

    location = /Routing.php {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        return 404;
    }
}
